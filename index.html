<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <form class="order-form">
      <label class="order-form-field-label" for="user-first-name">Your name<sup class="required-color">*</sup></label>
      <input
        class="order-form-input"
        id="user-first-name"
        type="text"
        placeholder="Oleksii"
        required
        minlength="2"
        name="user_first_name"
      />

      <label class="order-form-field-label" for="user-email">Your email<sup class="required-color">*</sup></label>
      <input
        class="order-form-input"
        type="email"
        id="user-email"
        placeholder="test@gmail.com"
        required
        name="user_email"
      />

      <label class="order-form-field-label" for="user-tel">Your phone number<sup class="required-color">*</sup></label>
      <input
        class="order-form-input"
        id="user-tel"
        type="tel"
        placeholder="xxx-xxx-xx-xx"
        required
        pattern="[0-9]{3}-[0-9]{3}-[0-9]{2}-[0-9]{2}"
        title="xxx-xxx-xx-xx"
        name="user_tel"
      />

      <fieldset class="pizza-size-wrapper">
        <legend>Pizza size</legend>
        <ul>
          <li>
            <input type="radio" name="pizza_size" id="pizza-size-s" value="s" />
            <label for="pizza-size-s">S</label>
          </li>
          <li>
            <input type="radio" name="pizza_size" id="pizza-size-m" value="m" />
            <label for="pizza-size-m">M</label>
          </li>
          <li>
            <input type="radio" name="pizza_size" id="pizza-size-l" value="l" />
            <label for="pizza-size-l">L</label>
          </li>
        </ul>
      </fieldset>

      <fieldset class="additional-ingredients-wrapper">
        <legend>Additional ingredients</legend>
        <ul>
          <li>
            <label>
              <input type="checkbox" name="additional_ingredients" value="cheese" />
              Cheese
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" name="additional_ingredients" value="peperoni" />
              Peperoni
            </label>
          </li>
          <li>
            <label>
              <input type="checkbox" name="additional_ingredients" value="mushrooms" />
              Mushrooms
            </label>
          </li>
        </ul>
      </fieldset>

      <label class="order-form-message-label">
        <span class="order-form-field-label">Your comment</span>
        <textarea class="order-form-message" name="user_comment" placeholder="Your message..."></textarea>
      </label>

      <select class="order-form-city" name="user_city">
        <optgroup label="Kyiv region">
          <option value="kyiv">Kyiv</option>
          <option value="irpin">Irpin</option>
          <option value="bucha">Bucha</option>
        </optgroup>
        <optgroup label="Poltava region">
          <option value="kremenchuk">Kremenchuk</option>
          <option value="globino">Globino</option>
          <option value="poltava">Poltava</option>
        </optgroup>
      </select>

      <div class="order-form-btn-wrapper">
        <button class="order-form-btn order-form-btn-reset" type="reset">Clear</button>
        <button class="order-form-btn order-form-btn-submit" type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
